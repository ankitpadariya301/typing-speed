<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeFlow — Typing Speed Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16171a;
    --surface: #1f2023;
    --surface-raised: #26282c;
    --border: #34363b;
    --paper: #ece5d5;
    --paper-text: #2b2924;

    --text-primary: #ede9e2;
    --text-secondary: #9a9c a3;
    --text-muted: #6f7178;

    --accent: #e8a33d;
    --accent-hover: #f2b358;
    --success: #7fbf95;
    --error: #d1685a;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;

    --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.45);
    --shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.25);

    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 20% 15%, rgba(232, 163, 61, 0.07), transparent 45%),
      var(--bg);
    font-family: var(--font-body);
    color: var(--text-primary);
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 32px;
  }

  /* Header */
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 600;
    margin-top: 4px;
    letter-spacing: -0.01em;
  }

  .timer-block {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .timer-value {
    font-family: var(--font-mono);
    font-size: 2rem;
    font-weight: 600;
    line-height: 1;
    color: var(--text-primary);
    transition: color 0.3s var(--ease);
  }

  .timer-value.low-time { color: var(--error); }

  .timer-label {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* Passage panel — the "paper" under the ribbon */
  .passage {
    background: var(--paper);
    color: var(--paper-text);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    min-height: 116px;
    font-family: var(--font-mono);
    font-size: 1.15rem;
    line-height: 1.7;
    letter-spacing: 0.01em;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.15);
    margin-bottom: 8px;
  }

  .passage .placeholder { color: rgba(43, 41, 36, 0.5); font-style: italic; font-family: var(--font-body); }

  .passage .char.correct { color: var(--success); }
  .passage .char.incorrect {
    color: var(--error);
    text-decoration: underline;
    text-decoration-color: rgba(209, 104, 90, 0.5);
  }
  .passage .char.current {
    background: rgba(232, 163, 61, 0.35);
    border-radius: 2px;
    animation: caret-pulse 1s var(--ease) infinite;
  }

  @keyframes caret-pulse {
    0%, 100% { background: rgba(232, 163, 61, 0.35); }
    50% { background: rgba(232, 163, 61, 0.1); }
  }

  /* Carriage progress bar */
  .carriage-track {
    height: 3px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .carriage-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.25s var(--ease);
  }

  /* Input */
  .input-group { margin-bottom: 24px; }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  textarea {
    width: 100%;
    resize: none;
    height: 88px;
    padding: 14px 16px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1.5;
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  textarea::placeholder { color: var(--text-muted); }

  textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.2);
  }

  textarea:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    text-align: center;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Controls */
  .controls { display: flex; gap: 12px; }

  button {
    flex: 1;
    padding: 13px 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  button:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--accent);
    color: #1a1200;
    box-shadow: var(--shadow-soft);
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--text-secondary);
    color: var(--text-primary);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Result toast */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--surface-raised);
    border: 1px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 14px 22px;
    font-family: var(--font-mono);
    font-size: 0.9rem;
    box-shadow: var(--shadow-card);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
  }

  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 480px) {
    .card { padding: 22px; }
    .stats { gap: 8px; }
    .controls { flex-direction: column; }
    .passage { font-size: 1rem; }
  }
</style>
</head>
<body>

  <main class="card">
    <div class="card-header">
      <div>
        <p class="eyebrow">Typing Test</p>
        <h1>How fast can you type?</h1>
      </div>
      <div class="timer-block">
        <div class="timer-value" id="timer" aria-live="polite">60</div>
        <div class="timer-label">seconds</div>
      </div>
    </div>

    <div class="passage" id="passage" aria-live="off">
      <span class="placeholder">Press Start to load a passage.</span>
    </div>

    <div class="carriage-track" role="presentation">
      <div class="carriage-fill" id="carriage-fill"></div>
    </div>

    <div class="input-group">
      <label for="text-input" class="visually-hidden">Type the passage above</label>
      <textarea
        id="text-input"
        placeholder="Start typing here..."
        disabled
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      ></textarea>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="wpm">0</div>
        <div class="stat-label">WPM</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="accuracy">0%</div>
        <div class="stat-label">Accuracy</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="progress">0%</div>
        <div class="stat-label">Progress</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="start-btn" type="button">Start Test</button>
      <button class="btn-secondary" id="restart-btn" type="button">Restart</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const TEST_DURATION = 60;
    const PASSAGES = [
      "The quick brown fox jumps over the lazy dog.",
      "Typing speed tests are fun and improve your skills.",
      "Practice makes perfect when it comes to typing fast.",
      "JavaScript is essential for front-end web development.",
    ];

    const el = {
      passage: document.getElementById('passage'),
      input: document.getElementById('text-input'),
      timer: document.getElementById('timer'),
      wpm: document.getElementById('wpm'),
      accuracy: document.getElementById('accuracy'),
      progress: document.getElementById('progress'),
      carriageFill: document.getElementById('carriage-fill'),
      startBtn: document.getElementById('start-btn'),
      restartBtn: document.getElementById('restart-btn'),
      toast: document.getElementById('toast'),
    };

    let state = {
      originalText: '',
      timeLeft: TEST_DURATION,
      isRunning: false,
      intervalId: null,
    };

    el.startBtn.addEventListener('click', startTest);
    el.restartBtn.addEventListener('click', resetTest);
    el.input.addEventListener('input', () => {
      if (state.isRunning) updateStats();
    });

    function startTest() {
      resetTest();
      state.originalText = PASSAGES[Math.floor(Math.random() * PASSAGES.length)];
      renderPassage(state.originalText);

      el.input.disabled = false;
      el.input.focus();
      state.isRunning = true;

      state.intervalId = setInterval(() => {
        state.timeLeft--;
        el.timer.textContent = state.timeLeft;
        el.timer.classList.toggle('low-time', state.timeLeft <= 10);

        if (state.timeLeft <= 0) {
          endTest(false);
        } else {
          updateStats();
        }
      }, 1000);
    }

    function resetTest() {
      clearInterval(state.intervalId);
      state = { originalText: '', timeLeft: TEST_DURATION, isRunning: false, intervalId: null };

      el.timer.textContent = TEST_DURATION;
      el.timer.classList.remove('low-time');
      el.input.value = '';
      el.input.disabled = true;
      el.wpm.textContent = '0';
      el.accuracy.textContent = '0%';
      el.progress.textContent = '0%';
      el.carriageFill.style.width = '0%';
      el.passage.innerHTML = '<span class="placeholder">Press Start to load a passage.</span>';
      hideToast();
    }

    function renderPassage(text) {
      el.passage.innerHTML = '';
      const fragment = document.createDocumentFragment();
      text.split('').forEach((char) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char;
        fragment.appendChild(span);
      });
      el.passage.appendChild(fragment);
    }

    function updateStats() {
      const typed = el.input.value;
      const chars = el.passage.querySelectorAll('.char');
      let correctCount = 0;

      chars.forEach((span, i) => {
        span.classList.remove('correct', 'incorrect', 'current');
        if (i < typed.length) {
          const isCorrect = typed[i] === state.originalText[i];
          span.classList.add(isCorrect ? 'correct' : 'incorrect');
          if (isCorrect) correctCount++;
        } else if (i === typed.length) {
          span.classList.add('current');
        }
      });

      const accuracy = typed.length === 0 ? 0 : Math.round((correctCount / typed.length) * 100);
      const elapsedMinutes = (TEST_DURATION - state.timeLeft) / 60;
      const wordsTyped = typed.trim().split(/\s+/).filter(Boolean).length;
      const wpm = elapsedMinutes > 0 ? Math.round(wordsTyped / elapsedMinutes) : 0;
      const progress = Math.round((typed.length / state.originalText.length) * 100);

      el.wpm.textContent = wpm;
      el.accuracy.textContent = `${accuracy}%`;
      el.progress.textContent = `${Math.min(progress, 100)}%`;
      el.carriageFill.style.width = `${Math.min(progress, 100)}%`;

      if (typed === state.originalText) {
        endTest(true);
      }
    }

    function endTest(completed) {
      clearInterval(state.intervalId);
      state.isRunning = false;
      el.input.disabled = true;

      const wpm = el.wpm.textContent;
      const accuracy = el.accuracy.textContent;
      const message = completed
        ? `Passage complete — ${wpm} WPM, ${accuracy} accuracy`
        : `Time's up — ${wpm} WPM, ${accuracy} accuracy`;

      showToast(message);
    }

    function showToast(message) {
      el.toast.textContent = message;
      el.toast.classList.add('visible');
    }

    function hideToast() {
      el.toast.classList.remove('visible');
      el.toast.textContent = '';
    }
  </script>
</body>
</html>
